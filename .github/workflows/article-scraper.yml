name: Business Lawyers 記事スクレイパー

on:
  schedule:
    # 毎日日本時間10時（UTC 1時）に実行
    - cron: '0 1 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  scrape-and-generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/article-update-notifier-KlZqZ

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: フォントのインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-dejavu

      - name: 記事のスクレイピングとPDF生成
        run: |
          python article_scraper.py

      - name: 生成されたファイルの確認
        run: |
          ls -la articles/

      - name: メール通知の送信
        run: |
          python send_email.py
        env:
          EMAIL_TO: fi.13-51@outlook.jp
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        continue-on-error: true

      - name: Git設定
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

      - name: 変更をコミット
        run: |
          git add articles/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Update: Business Lawyers 記事 ($(date +'%Y-%m-%d %H:%M'))"
          fi

      - name: 変更をプッシュ
        run: |
          git push -u origin claude/article-update-notifier-KlZqZ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
